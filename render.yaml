# Render blueprint for the ForgeLab API (ADR-0026).
services:
  - type: web
    name: forgelab-api
    runtime: docker
    plan: free
    # Deploy only after the GitHub CI checks on the commit pass.
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # The dashboard's origin, e.g. https://forgelab.example.com; leave
      # unset to send no CORS headers.
      - key: FORGELAB_ALLOW_ORIGIN
        sync: false
      # Postgres URL for the application store (ADR-0030); migrations apply at
      # startup. Leave unset to run without a database.
      - key: DATABASE_URL
        sync: false
