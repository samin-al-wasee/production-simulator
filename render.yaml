# Render blueprint for the ForgeLab API (ADR-0026).
services:
  - type: web
    name: forgelab-api
    runtime: docker
    plan: free
    # Deploy only after the GitHub CI checks on the commit pass.
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # The dashboard's origin, e.g. https://forgelab.example.com; leave
      # unset to send no CORS headers.
      - key: FORGELAB_ALLOW_ORIGIN
        sync: false
      # Postgres URL for the application store (ADR-0030); migrations apply at
      # startup. Leave unset to run without a database.
      - key: DATABASE_URL
        sync: false
      # OAuth sign-in (ADR-0031, ADR-0033). Set a provider's id and secret to
      # offer it; both are optional. FORGELAB_PUBLIC_URL must be the dashboard's
      # public URL (not this service's): the OAuth callback returns through the
      # dashboard's /api/v1/auth proxy so the session cookie lands there.
      - key: FORGELAB_PUBLIC_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
