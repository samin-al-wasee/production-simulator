apiVersion: forgelab/v1
kind: SecretScan
# Every entry must say why the match is not a real secret.
allow:
  - path: backend/internal/secretscan/secretscan_test.go
    reason: Test fixtures containing deliberately fake credentials to prove the scanner detects them.
  - path: .github/workflows/backend.yml
    reason: The password of the ephemeral Postgres service the CI test job starts; a local-only test default, not a real credential.
  - path: .devcontainer/docker-compose.yml
    reason: The password of the local development Postgres service; a local-only default on the devcontainer network, not a real credential.
  - path: .commandcode/settings.json
    rule: credential-assignment
    reason: An agent permission probe that connects to the local development Postgres with the same devcontainer default as .devcontainer/docker-compose.yml; not a real credential.
  - path: frontend/e2e/auth.spec.ts
    rule: credential-assignment
    reason: A local variable named `token` assigned a session seeded at test time; no credential is committed.
  - path: frontend/playwright.auth.config.ts
    rule: credential-assignment
    reason: A dummy GitHub client secret for the test API; not a real credential and never sent to a provider.
