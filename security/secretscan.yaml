apiVersion: forgelab/v1
kind: SecretScan
# Every entry must say why the match is not a real secret.
allow:
  - path: core/internal/secretscan/secretscan_test.go
    reason: Test fixtures containing deliberately fake credentials to prove the scanner detects them.
  - path: core/internal/compliance/compliance_test.go
    reason: Test fixtures containing deliberately fake credentials to prove the compliance checks detect them.
  - path: environments/local/.env.example
    reason: Documented local-only development defaults for the Docker Compose lab; real values go in the git-ignored .env.
  - path: environments/local/security/certs/*
    rule: private-key
    reason: Generated, git-ignored local development key material (scripts/gen-dev-certs.sh); never committed.
