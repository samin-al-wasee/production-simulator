# SPA + API application with a database and a reverse proxy.
apiVersion: forgelab/v1
kind: Application
metadata:
  name: shop-backend
  description: Store API used to exercise multi-component manifests
  owner: platform
spec:
  shape: spa-plus-api
  runtime:
    image: example/api:2.3
    command: ["run"]
    ports: [8080]
    env: ["DATABASE_URL"]
    replicas: 3
  components:
    databases:
      - name: PostgreSQL
        version: "16"
        config:
          pooled: true
    networking:
      - name: Reverse Proxy
        version: "1.0"
        config:
          tls: false