apiVersion: v1
kind: Service
metadata:
  name: sample-web
  namespace: forgelab
spec:
  selector:
    app: sample-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  namespace: forgelab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Zero unavailable pods during a rollout: a new pod must be Ready before an
  # old one is removed, so a bad release stalls instead of causing an outage.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sample-web
  template:
    metadata:
      labels:
        app: sample-web
    spec:
      containers:
        - name: sample-web
          image: forgelab/sample-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: v1
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /version, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-web
  namespace: forgelab
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sample-web
