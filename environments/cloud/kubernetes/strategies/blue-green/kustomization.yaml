apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Blue/green cutover: both colors run; the Service selects one. Apply, then
# switch traffic with scripts/k8s-bluegreen-switch.sh <blue|green>.
resources:
  - ../../base
  - colors.yaml
patches:
  - target:
      kind: Service
      name: sample-web
    patch: |-
      - op: add
        path: /spec/selector/slot
        value: blue
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sample-web
        namespace: forgelab
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: sample-web
        namespace: forgelab
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: sample-web
        namespace: forgelab
