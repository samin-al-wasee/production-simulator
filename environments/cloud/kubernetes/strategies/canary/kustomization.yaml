apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Canary release with weighted ingress routing. Apply on top of base:
#   kubectl apply -k environments/cloud/kubernetes/strategies/canary
# Raise or lower the weight with:
#   kubectl -n forgelab annotate ingress sample-web-canary \
#     nginx.ingress.kubernetes.io/canary-weight=50 --overwrite
resources:
  - ../../base
  - canary.yaml
