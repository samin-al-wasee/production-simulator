# ForgeLab local preset — reverse proxy.
# Terminates HTTP and routes every request to the application service.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Status endpoint scraped by the observability overlay's nginx exporter.
# Reachable on the internal network only; the port is not published.
server {
    listen 8081;
    server_name _;

    location = /stub_status {
        stub_status;
    }
}
