name: forgelab-local

# Phase 1 minimal single-node topology (ADR-0002):
# reverse proxy -> one application -> one database.
# Everything is declared here; nothing is started manually.

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: forgelab-proxy
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - forgelab

  app:
    build:
      context: ../../applications/sample-web
    container_name: forgelab-app
    environment:
      APP_ADDR: ":8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-forgelab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-forgelab}
      DB_NAME: ${POSTGRES_DB:-forgelab}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - forgelab

  db:
    image: postgres:16-alpine
    container_name: forgelab-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgelab}
      POSTGRES_DB: ${POSTGRES_DB:-forgelab}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgelab} -d ${POSTGRES_DB:-forgelab}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - forgelab

volumes:
  dbdata:

networks:
  forgelab:
    driver: bridge