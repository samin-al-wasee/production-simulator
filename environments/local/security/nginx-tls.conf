# ForgeLab local preset - hardened reverse proxy (security overlay).
# TLS termination, HTTP to HTTPS redirect, security headers, request rate
# limiting, and blocked probing paths.

server_tokens off;

# 10 requests/second per client address with a burst of 20; excess requests
# receive 429.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    limit_req zone=perip burst=20 nodelay;

    # Probing paths: dotfiles (.env, .git) and internal telemetry are not
    # served through the public entry point.
    location ~ /\. {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Status endpoint scraped by the observability overlay's nginx exporter.
# Reachable on the internal network only; the port is not published.
server {
    listen 8081;
    server_name _;

    location = /stub_status {
        stub_status;
    }
}
