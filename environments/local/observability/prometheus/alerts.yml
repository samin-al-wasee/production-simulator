groups:
  - name: forgelab-reference
    rules:
      - alert: TargetDown
        expr: up{optional!="true"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }})."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of requests are failing"
          description: "5xx ratio over the last 5 minutes is {{ $value | humanizePercentage }}."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 500ms"
          description: "p95 latency is {{ $value | humanizeDuration }}."

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable from its exporter"

      - alert: DatabaseConnectionsHigh
        expr: |
          sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"

      - alert: MessagingTargetDown
        expr: max_over_time(up{optional="true"}[1h]) == 1 and up{optional="true"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} stopped responding"
          description: "An optional messaging/data component that was running is no longer scrapeable."

      - alert: RabbitMQDeadLetterMessages
        expr: rabbitmq_detailed_queue_messages_ready{queue=~".*dlq"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Messages are sitting in dead-letter queue {{ $labels.queue }}"

      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is lagging on {{ $labels.topic }}"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis is above 90% of maxmemory (evictions likely)"
