# Phase 2 observability overlay for the local preset (ADR-0005).
# Compose on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.observability.yaml up -d
# Every service is optional; without this file the base stack is unchanged.

services:
  app:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: forgelab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgelab

  grafana:
    image: grafana/grafana:11.4.0
    container_name: forgelab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - forgelab

  loki:
    image: grafana/loki:3.3.2
    container_name: forgelab-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - forgelab

  promtail:
    image: grafana/promtail:3.3.2
    container_name: forgelab-promtail
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./observability/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    x-forgelab-exempt:
      COMP-002: Promtail discovers container log files through the Docker API; the socket is mounted read-only and only in the optional observability overlay.
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - forgelab

  tempo:
    image: grafana/tempo:2.6.1
    container_name: forgelab-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    networks:
      - forgelab

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: forgelab-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
    networks:
      - forgelab

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.0
    container_name: forgelab-nginx-exporter
    command: ["--nginx.scrape-uri=http://proxy:8081/stub_status"]
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - forgelab

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: forgelab-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-forgelab}:${POSTGRES_PASSWORD:-forgelab}@db:5432/${POSTGRES_DB:-forgelab}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forgelab

volumes:
  promdata:
  grafanadata:
  lokidata:
  tempodata:
