# Phase 3 messaging & data overlay for the local preset (ADR-0006).
# Compose on top of compose.yaml (and optionally compose.observability.yaml):
#   docker compose -f compose.yaml -f compose.messaging.yaml up -d
# Every service is optional; without this file the base stack is unchanged.

services:
  app:
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: forgelab-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./messaging/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - forgelab

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: forgelab-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - forgelab

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: forgelab-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-forgelab}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-forgelab}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - forgelab

  rabbitmq-init:
    image: curlimages/curl:8.11.1
    container_name: forgelab-rabbitmq-init
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-forgelab}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-forgelab}
    volumes:
      - ./messaging/rabbitmq-definitions.json:/definitions.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        curl -fsS -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        -H 'content-type: application/json'
        -X POST http://rabbitmq:15672/api/definitions
        --data-binary @/definitions.json
    restart: "no"
    networks:
      - forgelab

  kafka:
    image: apache/kafka:3.9.0
    container_name: forgelab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - forgelab

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: forgelab-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in jobs jobs.retry jobs.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"
    networks:
      - forgelab

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: forgelab-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - forgelab

volumes:
  rabbitmqdata:
  kafkadata:
