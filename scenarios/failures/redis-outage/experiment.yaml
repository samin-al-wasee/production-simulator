apiVersion: forgelab/v1
kind: Experiment
metadata:
  name: redis-outage
spec:
  hypothesis: Cache-backed endpoints fail fast with 503 while Redis is down, the rest of the application keeps serving, and the cache works again after Redis restarts.
  target:
    container: forgelab-redis
  fault:
    type: stop
    duration: 20s
  probes:
    - {name: cache-works, url: "http://localhost:8080/api/cache?key=drill", phase: before, expectStatus: 200}
    - {name: cache-fails-fast, url: "http://localhost:8080/api/cache?key=drill", phase: during, expectStatus: 503}
    - {name: rest-of-app-up, url: "http://localhost:8080/healthz", phase: during, expectStatus: 200}
    - {name: cache-recovered, url: "http://localhost:8080/api/cache?key=drill", phase: after, expectStatus: 200, within: 60s}
