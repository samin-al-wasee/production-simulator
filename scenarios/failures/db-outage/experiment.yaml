apiVersion: forgelab/v1
kind: Experiment
metadata:
  name: db-outage
spec:
  hypothesis: The application reports itself degraded (503) while PostgreSQL is down, stays reachable, and returns to healthy after the database restarts.
  target:
    container: forgelab-db
  fault:
    type: stop
    duration: 20s
  probes:
    - {name: app-healthy, url: "http://localhost:8080/healthz", phase: before, expectStatus: 200}
    - {name: app-degraded, url: "http://localhost:8080/healthz", phase: during, expectStatus: 503, expectBody: unreachable}
    - {name: app-recovered, url: "http://localhost:8080/healthz", phase: after, expectStatus: 200, within: 60s}
