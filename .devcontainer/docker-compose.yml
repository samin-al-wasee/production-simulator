# ForgeLab development stack: the dev container and its Postgres application
# store (ADR-0030). The editor attaches to the `app` service; `db` is the
# local database it talks to over the compose network.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/production-simulator:cached
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/forgelab?sslmode=disable
      FORGELAB_TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/forgelab?sslmode=disable
      FORGELAB_ALLOW_ORIGIN: http://localhost:3001
      # The dashboard's public origin (ADR-0033): the OAuth callback returns
      # through the dashboard's /api/v1/auth proxy, so the session cookie lands
      # on the dashboard. Set provider client ids and secrets (or in the shell)
      # to enable sign-in, and register
      # <FORGELAB_PUBLIC_URL>/api/v1/auth/callback/<provider> with each provider.
      FORGELAB_PUBLIC_URL: http://localhost:3001
      # Provider credentials pass through from the host shell (set them before
      # opening the devcontainer); empty leaves sign-in off (ADR-0031). Kept
      # out of git by interpolation.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forgelab
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forgelab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
